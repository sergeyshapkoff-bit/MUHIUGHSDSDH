<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Стройка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; height: 100vh; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6a11cb 100%); color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px; flex-shrink: 0; }
        .user-info { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; }
        .avatar { width: 36px; height: 36px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; }
        .icons { font-size: 20px; display: flex; gap: 15px; opacity: 0.8; }
        main { flex: 1; padding: 0 20px; overflow-y: auto; display: none; padding-bottom: 100px; }
        main.active { display: block; }
        
        .bank-card { background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05)); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 20px; margin-bottom: 25px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; }
        .card-balance { font-size: 26px; font-weight: bold; }
        .card-balance span { font-size: 16px; font-weight: normal; opacity: 0.8; }
        .visa-logo { font-size: 22px; font-weight: 900; font-style: italic; letter-spacing: 2px; }
        .card-number { font-size: 18px; letter-spacing: 1.5px; margin-bottom: 15px; font-family: monospace; white-space: nowrap; display: flex; align-items: center; cursor: pointer; }
        .copy-icon { font-size: 12px; margin-left: 8px; opacity: 0.6; }
        .card-bottom { display: flex; justify-content: space-between; font-size: 13px; opacity: 0.9; }
        .cvc-block { display: flex; align-items: center; cursor: pointer; }
        
        .section-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: #a3c2ff; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 15px; margin-bottom: 10px; font-size: 14px; }
        
        .my-apt-card { background: rgba(255,255,255,0.08); border-radius: 15px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #4ade80; display: flex; justify-content: space-between; align-items: center; }
        .my-apt-title { font-weight: bold; font-size: 15px; margin-bottom: 5px; }
        .my-apt-income { font-size: 13px; color: #4ade80; }
        
        .fab-container { position: absolute; bottom: 70px; left: 0; width: 100%; display: flex; justify-content: center; pointer-events: none; z-index: 10; }
        .fab { width: 60px; height: 60px; background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; font-weight: 300; box-shadow: 0 4px 15px rgba(106, 17, 203, 0.5); border: 2px solid rgba(255, 255, 255, 0.2); pointer-events: auto; cursor: pointer; transition: transform 0.1s; }
        .fab:active { transform: scale(0.95); }
        
        nav { display: flex; justify-content: space-between; background: rgba(15, 23, 42, 0.95); padding: 12px 10px calc(12px + env(safe-area-inset-bottom)) 10px; border-top-left-radius: 25px; border-top-right-radius: 25px; backdrop-filter: blur(10px); position: absolute; bottom: 0; width: 100%; z-index: 5; }
        .nav-btn { background: none; border: none; color: #8892b0; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: 1; }
        .nav-btn span { font-size: 22px; margin-bottom: 2px; }
        .nav-btn.active { color: #ffffff; }
        
        #shop-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a24; z-index: 100; display: none; flex-direction: column; }
        .shop-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #232333; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .shop-header h2 { margin: 0; font-size: 20px; }
        .close-btn { background: rgba(255,255,255,0.1); border: none; color: white; font-size: 20px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .shop-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 50px; }
        .class-group { margin-bottom: 25px; }
        .class-title { font-size: 16px; font-weight: bold; color: #a3c2ff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .apt-shop-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.06); padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .apt-shop-info { display: flex; flex-direction: column; gap: 4px; flex: 1; padding-right: 10px; }
        .apt-shop-name { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 5px; }
        .apt-shop-desc { font-size: 12px; color: #8892b0; }
        .apt-shop-income { font-size: 12px; color: #4ade80; font-weight: bold; margin-top: 4px; }
        .buy-btn { background: #4ade80; color: #000; border: none; padding: 10px 15px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        .buy-btn:active { background: #22c55e; }
        
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #4ade80; color: #000; padding: 10px 20px; border-radius: 30px; font-weight: bold; font-size: 14px; transition: transform 0.3s; z-index: 200; }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="toast">Скопировано!</div>
    <header>
        <div class="user-info">
            <div class="avatar">👤</div>
            <span id="user-name">Загрузка...</span>
        </div>
        <div class="icons"><span>🔒</span><span>⚙️</span></div>
    </header>

    <main id="tab-balance" class="active">
        <div class="bank-card">
            <div class="card-top">
                <div class="card-balance" id="user-balance">0 <span>€</span></div>
                <div class="visa-logo">VISA</div>
            </div>
            <div class="card-number" onclick="copyText(document.getElementById('card-number').innerText)">
                <span id="card-number">**** **** **** ****</span>
                <span class="copy-icon">📋</span>
            </div>
            <div class="card-bottom">
                <div id="card-holder">NAME SURNAME</div>
                <div class="cvc-block" onclick="copyText(document.getElementById('card-cvc').innerText.replace('CVC: ', ''))">
                    <span id="card-cvc">CVC: ***</span>
                    <span class="copy-icon">📋</span>
                </div>
            </div>
        </div>

        <div class="section-title">Топ по балансу</div>
        <div id="leaderboard-list">
            <div style="color:#8892b0; text-align:center; padding: 20px;">Загрузка топа...</div>
        </div>
    </main>

    <main id="tab-apartments">
        <div class="section-title">Твой общий доход: <span style="color:#4ade80" id="total-income">0 €/ч</span></div>
        <div id="my-apartments-list"></div>
    </main>

    <main id="tab-trades">
        <div class="list-item" style="margin-top:20px; flex-direction:column; align-items:flex-start;">
            <h2 style="margin:0 0 10px 0;">📈 Биржа</h2>
            <p style="font-size:12px; color:#8892b0; margin:0;">Здесь скоро появится возможность перепродавать свои квартиры другим игрокам по выгодной цене.</p>
        </div>
    </main>

    <div class="fab-container">
        <div class="fab" onclick="openShop()">+</div>
    </div>

    <nav>
        <button class="nav-btn" onclick="switchTab('apartments', this)"><span>🏢</span> Квартиры</button>
        <button class="nav-btn active" onclick="switchTab('balance', this)"><span>💰</span> Баланс</button>
        <button class="nav-btn" onclick="switchTab('trades', this)"><span>📈</span> Трейды</button>
    </nav>

    <div id="shop-modal">
        <div class="shop-header">
            <h2>🏢 Магазин</h2>
            <button class="close-btn" onclick="closeShop()">✕</button>
        </div>
        <div class="shop-content" id="shop-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user;
        let userId = user ? user.id : 123456789; 
        let userName = user ? (user.first_name + (user.last_name ? " " + user.last_name : "")) : "Гость";

        document.getElementById("user-name").innerText = userName;
        document.getElementById("card-holder").innerText = userName.toUpperCase();

        function getCardDetails() {
            let savedCard = localStorage.getItem('card_' + userId);
            if (!savedCard) {
                let num = "4" + Array.from({length: 15}, () => Math.floor(Math.random() * 10)).join('');
                let formattedNum = num.match(/.{1,4}/g).join(' ');
                let cvc = Math.floor(100 + Math.random() * 900);
                let cardInfo = { number: formattedNum, cvc: cvc };
                localStorage.setItem('card_' + userId, JSON.stringify(cardInfo));
                return cardInfo;
            }
            return JSON.parse(savedCard);
        }
        let card = getCardDetails();
        document.getElementById("card-number").innerText = card.number;
        document.getElementById("card-cvc").innerText = "CVC: " + card.cvc;

        // Загрузка данных с сервера
        async function loadData() {
            try {
                // Отправляем имя на сервер
                const url = `https://got.de1.netrun.io/api/balance/${userId}?name=${encodeURIComponent(userName)}`;
                const response = await fetch(url);
                const data = await response.json();
                
                let formattedBalance = data.balance.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
                document.getElementById("user-balance").innerHTML = `${formattedBalance} <span>€</span>`;
                
                renderMyApartments(data.apartments || []);
            } catch (error) {
                console.error("Ошибка:", error);
                document.getElementById("user-balance").innerHTML = `Ошибка <span>⚠️</span>`; 
            }
        }

        // Загрузка топа игроков
        async function loadLeaderboard() {
            try {
                const response = await fetch(`https://got.de1.netrun.io/api/leaderboard`);
                const data = await response.json();
                
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = '';
                
                if (!data.leaders || data.leaders.length === 0) {
                    list.innerHTML = `<div style="color:#8892b0; text-align:center; padding: 20px;">Пока нет игроков</div>`;
                    return;
                }

                const medals = ["🥇", "🥈", "🥉", "🏅", "🏅"];
                data.leaders.forEach((player, index) => {
                    let fBalance = player.balance.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
                    list.innerHTML += `
                    <div class="list-item">
                        <span>${medals[index]} ${player.name}</span>
                        <span style="color: #4ade80;">${fBalance} €</span>
                    </div>`;
                });
            } catch (e) {
                console.error("Ошибка загрузки топа:", e);
            }
        }

        function renderMyApartments(apts) {
            const list = document.getElementById('my-apartments-list');
            list.innerHTML = '';
            
            if (apts.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#8892b0; margin-top:20px; font-size:13px;">У тебя пока нет квартир. Нажми «+», чтобы купить!</div>`;
                document.getElementById("total-income").innerText = `0 €/ч`;
                return;
            }

            let totalInc = 0;
            apts.forEach((apt, index) => {
                totalInc += apt.income;
                let formattedInc = apt.income.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
                list.innerHTML += `
                <div class="my-apt-card">
                    <div>
                        <div class="my-apt-title">🏠 ${apt.name}</div>
                        <div class="my-apt-income">💵 ${formattedInc} €/ч</div>
                    </div>
                    <div style="font-size: 24px;">🏢</div>
                </div>`;
            });
            
            let formattedTotal = totalInc.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            document.getElementById("total-income").innerText = `${formattedTotal} €/ч`;
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('main').forEach(m => m.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function copyText(text) {
            navigator.clipboard.writeText(text.trim()).then(() => {
                const toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 2000);
            });
        }

        const shopData = [
            { class: "🏚 Эконом-класс", items: [
                { name: "Студия «Муравейник»", price: 15000, income: 100, desc: "15 кв.м, окна во двор." },
                { name: "Хрущёвка", price: 45000, income: 400, desc: "Советский уют, 2 этаж." },
                { name: "Панелька", price: 120000, income: 1200, desc: "Слышно соседей, зато своё." }
            ]},
            { class: "🏙 Комфорт-класс", items: [
                { name: "Кирпичный дом", price: 350000, income: 4000, desc: "Рядом парк и школа." },
                { name: "ЖК «Солнечный»", price: 800000, income: 10000, desc: "Новый дом, закрытый двор." }
            ]},
            { class: "💼 Бизнес-класс", items: [
                { name: "ЖК «Небоскрёб»", price: 2500000, income: 35000, desc: "Панорамный вид на город." },
                { name: "Лофт в центре", price: 5000000, income: 80000, desc: "Высокие потолки, кирпичные стены." }
            ]},
            { class: "👑 Премиум", items: [
                { name: "Пентхаус", price: 15000000, income: 300000, desc: "Собственная терраса и бассейн." },
                { name: "Остров «Форбс»", price: 100000000, income: 2500000, desc: "Личный частный остров." }
            ]}
        ];

        function openShop() {
            const modal = document.getElementById('shop-modal');
            const list = document.getElementById('shop-list');
            list.innerHTML = '';
            
            shopData.forEach(group => {
                let html = `<div class="class-group"><div class="class-title">${group.class}</div>`;
                group.items.forEach((item, index) => {
                    let fPrice = item.price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
                    let fIncome = item.income.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
                    html += `
                    <div class="apt-shop-item">
                        <div class="apt-shop-info">
                            <div class="apt-shop-name">🏠 ${item.name}</div>
                            <div class="apt-shop-desc">${item.desc}</div>
                            <div class="apt-shop-income">+ ${fIncome} €/ч</div>
                        </div>
                        <button class="buy-btn" onclick="tryBuyApartment('${group.class}', ${index})">
                            ${fPrice} €
                        </button>
                    </div>`;
                });
                html += `</div>`;
                list.innerHTML += html;
            });

            modal.style.display = 'flex';
            if (tg.BackButton) tg.BackButton.show();
        }

        function closeShop() {
            document.getElementById('shop-modal').style.display = 'none';
            if (tg.BackButton) tg.BackButton.hide();
        }

        if (tg.BackButton) {
            tg.BackButton.onClick(() => closeShop());
        }

        async function tryBuyApartment(groupName, itemIndex) {
            const group = shopData.find(g => g.class === groupName);
            const item = group.items[itemIndex];
            
            const confirm = await tg.showConfirm(`Купить "${item.name}" за ${item.price} €?`);
            if (!confirm) return;

            try {
                const response = await fetch('https://got.de1.netrun.io/api/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        user_name: userName,
                        apartment_name: item.name,
                        price: item.price,
                        income: item.income
                    })
                });
                
                const res = await response.json();
                
                if (res.status === 'ok') {
                    tg.showAlert('✅ Успешно куплено!');
                    closeShop();
                    loadData(); // Обновляем баланс
                    loadLeaderboard(); // Обновляем топ
                } else {
                    tg.showAlert(`❌ ${res.message}`);
                }
            } catch (e) {
                tg.showAlert('⚠️ Ошибка соединения с сервером');
            }
        }

        // Инициализация при запуске
        loadData();
        loadLeaderboard();
    </script>
</body>
</html>
